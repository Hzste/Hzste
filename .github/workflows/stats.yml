name: stats

on:
  schedule:
    - cron: "17 3 * * 1,4"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "generated/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build stat cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_stats.py
      - name: Commit and push
        run: |
          git config user.name "Huseyin Gedes"
          git config user.email "gedeshuseyin@hotmail.com"
          git add generated
          git diff --cached --quiet || git commit -m "Update stats"
          git push
